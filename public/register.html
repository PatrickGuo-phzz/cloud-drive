<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 — 云盒 CloudBox</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card card">
      <a class="brand brand-center" href="/"><span class="brand-mark">📦</span> 云盒 <span class="brand-en">CloudBox</span></a>
      <h1 class="auth-title">创建账号</h1>
      <p class="auth-sub">一分钟即可开始使用云盒</p>

      <div id="form-alert" class="alert alert-error hidden" role="alert"></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 placeholder="2-20 位字母、数字、下划线或中文" required />
        </div>
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="new-password"
                 placeholder="至少 8 位" required minlength="8" />
        </div>
        <div class="field">
          <label for="confirm-password">确认密码</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password"
                 placeholder="再输入一次密码" required />
        </div>
        <button id="submit-btn" class="btn btn-primary btn-block" type="submit">注 册</button>
      </form>

      <p class="auth-alt">已有账号？<a href="/login">直接登录</a></p>
      <p class="auth-alt"><a class="muted-link" href="/">← 返回首页</a></p>
    </div>
  </main>

  <div id="toasts" class="toasts"></div>
  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
